<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Máy tính đơn giản</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef1f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .calculator {
    background: #ffffff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    width: 320px;
  }
  #display {
    width: 100%;
    min-height: 70px;
    background: #ffffff;
    color: #1b1b1b;
    font-size: 2.6rem;
    font-weight: 400;
    text-align: right;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    line-height: 1.2;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  button {
    padding: 20px 0;
    font-size: 1.3rem;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    background: #f3f3f3;
    color: #1b1b1b;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover {
    background: #e4e4e4;
  }
  button.operator {
    background: #f7f7f7;
    color: #005fb8;
  }
  button.operator:hover {
    background: #eaeaea;
  }
  button.equal {
    background: #005fb8;
    color: #fff;
    grid-column: 1 / -1;
  }
  button.equal:hover {
    background: #0078d4;
  }
  button.clear {
    background: #f3f3f3;
    color: #d13438;
  }
  button.clear:hover {
    background: #e4e4e4;
  }
</style>
</head>
<body>

<div class="calculator">
  <div id="display">0</div>
  <div class="buttons">
    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-value="/">/</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="operator" data-value="*">*</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="operator" data-value="-">-</button>

    <button class="clear" data-action="clear">Clear</button>
    <button data-value="0">0</button>
    <button data-value=".">.</button>
    <button class="operator" data-value="+">+</button>

    <button class="equal" data-action="equal">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  const buttons = document.querySelectorAll('button');
  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      const action = button.dataset.action;
      const value = button.dataset.value;

      if (action === 'clear') {
        display.innerText = '0';
        return;
      }

      if (action === 'equal') {
        calculateResult();
        return;
      }
      appendValue(value);
    });
  });

  function appendValue(value) {
    // Kiểm tra điều kiện đầu vào trước khi nối chuỗi
    const current = display.innerText;

    if (current === '0' && value !== '.') {
      display.innerText = value;
    } else {
      display.innerText = current + value;
    }
  }

  function calculateResult() {
    const expression = display.innerText;

    const isValidExpression = /^[0-9+\-*/.\s]+$/.test(expression);

    if (!isValidExpression) {
      display.innerText = 'Lỗi';
      return;
    }

    try {
      const result = Function('"use strict"; return (' + expression + ')')();

      if (result === undefined || Number.isNaN(result) || !Number.isFinite(result)) {
        display.innerText = 'Lỗi';
      } else {
        display.innerText = String(result);
      }
    } catch (err) {
      display.innerText = 'Lỗi';
    }
  }
</script>

</body>
</html>
